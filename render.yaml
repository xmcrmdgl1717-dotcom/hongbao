services:
  - type: web
    name: red-packet-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"

  - type: static       # ✅ 正确
    name: red-packet-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_WS_URL
        value: wss://red-packet-server.onrender.com/ws
