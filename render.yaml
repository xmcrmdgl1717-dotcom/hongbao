services:
  # 后端 Web 服务 (Node.js)
  - type: web
    name: red-packet-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "20"

  # 前端静态站点 (Vue)
  - type: web              # 必须为 web
    name: red-packet-client
    runtime: static        # 通过 runtime 指定为静态站点
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # 注意：静态站点没有 plan 字段，必须移除 plan: free
    envVars:
      - key: VITE_WS_URL
        value: wss://red-packet-server.onrender.com/ws
